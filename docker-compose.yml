version: "3.8"

services:
  cloud-sql-proxy:
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.11.0
    container_name: cloud-sql-proxy
    command:
      - "master-host-480008-i9:asia-east1:blackhawk-db"
      - "--address=0.0.0.0"
      - "--port=3306"
    volumes:
      - ./credentials.json:/credentials.json:ro
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/credentials.json
    restart: always

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=cloud-sql-proxy
      - DB_PORT=3306
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - cloud-sql-proxy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: always

  adminer:
    image: adminer:4.8.1
    container_name: adminer
    ports:
      - "5001:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=cloud-sql-proxy
    depends_on:
      - cloud-sql-proxy
    restart: always
